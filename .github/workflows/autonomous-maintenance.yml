name: Autonomous maintenance

on:
  schedule:
    # Twice daily, IST wall-clock (GitHub Actions cron is UTC; IST = UTC+5:30):
    # 9:00am and 9:00pm IST. Offset from cursor-autonomous-maintenance.yml's IST slots
    # so the two engines never wake at the same instant. See docs/AUTOMATION.md.
    - cron: "30 3,15 * * *"
  workflow_dispatch:

concurrency:
  group: autonomous-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  security-events: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check open autonomous PRs and task backlog
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Don't block on *any* open autonomous PR — only skip once every task slot is
          # taken (a hard safety net against runaway PR count). Otherwise pass the list of
          # currently-open autonomous PRs to the prompt so Claude can avoid opening a
          # second PR for the same task while still opening a separate PR for a genuinely
          # independent one.
          # --limit 100 is explicit everywhere below (not the gh CLI default of 30) — a
          # missing --limit silently truncates instead of erroring, and this repo has
          # already hit that: with 30+ open claude-task issues, gh issue list's default
          # newest-first order silently dropped every issue below the cutoff, including
          # several priority:high ones (#45-49) that should have outranked what Phase A
          # was actually shown. See #45/#81's comment history for the incident.
          open_prs=$(gh pr list --state open --limit 100 --json headRefName,title \
            --jq '[.[] | select(.headRefName | startswith("claude/auto-"))]')
          count=$(jq 'length' <<<"$open_prs")

          summary=$(jq -r '.[] | "- \(.headRefName): \(.title)"' <<<"$open_prs")
          {
            echo "open_prs<<PR_EOF"
            echo "$summary"
            echo "PR_EOF"
          } >> "$GITHUB_OUTPUT"

          # Phase 0 check: is the latest push to main currently red? This is the top-priority
          # condition (see prompt below) and, unlike Phase A/B, is allowed to bypass the 5-PR
          # ceiling — a broken main blocks every other PR's merge via the required `test`
          # check, so healing it is never redundant with an already-open PR.
          main_ci=$(gh run list --workflow=ci.yml --branch=main --status=completed --limit=1 \
            --json conclusion,url,headSha)
          main_ci_conclusion=$(jq -r '.[0].conclusion // "unknown"' <<<"$main_ci")
          main_ci_url=$(jq -r '.[0].url // ""' <<<"$main_ci")
          if [ "$main_ci_conclusion" = "failure" ]; then
            echo "main_ci_broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_ci_broken=false" >> "$GITHUB_OUTPUT"
          fi
          echo "main_ci_run_url=$main_ci_url" >> "$GITHUB_OUTPUT"

          # Deploy-failure detection (see #256): is the latest push to main's deploy.yml (GitHub
          # Pages) run currently red? Independent of ci.yml — deploy.yml triggers on every push to
          # main without gating on ci.yml passing first, so a broken live-site deploy could
          # otherwise sit red indefinitely with nothing in the automation ever noticing. Handled by
          # the deterministic "Surface a broken deploy.yml run" step below, not by the Claude
          # prompt — deploy.yml itself is on the protected/denied file list (this workflow can never
          # fix it directly), so no judgment call is actually needed here, only a plain
          # comment/issue post; per this repo's determinism-first automation-design principle (see
          # AGENTS.md), that means a plain script, not an LLM invocation. This also means the check
          # runs and gets surfaced every time regardless of the 5-PR skip ceiling or a tolerated
          # Claude-side failure — unlike a check embedded in the prompt, which would silently never
          # fire whenever skip=true or the Claude step fails.
          main_deploy=$(gh run list --workflow=deploy.yml --branch=main --status=completed --limit=1 \
            --json conclusion,url)
          main_deploy_conclusion=$(jq -r '.[0].conclusion // "unknown"' <<<"$main_deploy")
          main_deploy_url=$(jq -r '.[0].url // ""' <<<"$main_deploy")
          if [ "$main_deploy_conclusion" = "failure" ]; then
            echo "main_deploy_broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_deploy_broken=false" >> "$GITHUB_OUTPUT"
          fi
          echo "main_deploy_run_url=$main_deploy_url" >> "$GITHUB_OUTPUT"

          # Phase 0 check: open PRs with a failing check, excluding claude/auto-* (already
          # owned by autonomous-pr-followup.yml's webhook-driven fixes) and fork PRs (never
          # ours to touch). In practice this mostly surfaces Dependabot PRs that have gone
          # stale against main and nothing currently re-syncs them.
          failing_prs=$(gh pr list --state open --limit 100 \
            --json number,headRefName,title,isCrossRepository,statusCheckRollup \
            --jq '[.[] | select(.isCrossRepository == false)
                        | select(.headRefName | startswith("claude/auto-") | not)
                        | select([.statusCheckRollup[]?.conclusion] | any(. == "FAILURE"))]
                  | .[] | "- #\(.number) (\(.headRefName)): \(.title)"')
          {
            echo "failing_prs<<FAIL_EOF"
            echo "$failing_prs"
            echo "FAIL_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$count" -ge 5 ] && [ "$main_ci_conclusion" != "failure" ]; then
            echo "5 autonomous PRs already open (one per task slot) — skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          # Fetch the human-curated task backlog: open issues labeled claude-task. These
          # take priority over the built-in maintenance menu — the prompt gets the list
          # (number + title) and reads the chosen issue's full spec with `gh issue view`.
          # Issues also labeled `blocked` are excluded: a previous run already established
          # they can't be done unattended — either an environment/permission blocker, or (see
          # the prompt's comment-history check below) a confirmed repeat: two consecutive
          # runs independently concluded the issue can't be implemented as written (e.g. a
          # stale spec targeting a mechanism the codebase no longer has) with nothing new in
          # between. Either way, re-attempting on every scheduled run just burns quota re-deriving the
          # same conclusion — a human unblocks (after closing, rewriting, or otherwise
          # resolving the issue) and removes the label to make it eligible again.
          #
          # --limit 200 (well above realistic backlog size) plus an explicit priority-aware
          # sort/cap below is deliberate, not decoration: see the --limit 100 comment above
          # for the truncation incident this guards against. The list handed to the prompt
          # is additionally capped at TASK_DISPLAY_CAP entries — sorted priority:high first,
          # then normal, then priority:low, each tier by ascending issue number (matching
          # Phase A's own walk order) — so a growing backlog can never silently push a
          # priority:high issue out of what Claude actually sees, and the per-run token cost
          # of this feed stays bounded rather than growing unboundedly with backlog size.
          TASK_DISPLAY_CAP=30
          open_tasks_json=$(gh issue list --label claude-task --state open --limit 200 \
            --json number,title,labels \
            --jq '[.[] | select([.labels[].name] | index("blocked") | not)]')
          open_tasks_count=$(jq 'length' <<<"$open_tasks_json")
          open_tasks=$(jq -r --argjson cap "$TASK_DISPLAY_CAP" '
            def prio: if ([.labels[].name] | index("priority:high")) then 0
                      elif ([.labels[].name] | index("priority:low")) then 2
                      else 1 end;
            (sort_by(prio, .number))[0:$cap][]
            | "- #\(.number): \(.title)"
          ' <<<"$open_tasks_json")
          if [ "$open_tasks_count" -gt "$TASK_DISPLAY_CAP" ]; then
            hidden=$((open_tasks_count - TASK_DISPLAY_CAP))
            open_tasks="$open_tasks
            - (+$hidden more open claude-task issue(s) not shown, lowest-priority/highest-numbered end of the backlog — see \`gh issue list --label claude-task --state open\` for the rest)"
          fi
          {
            echo "open_tasks<<TASK_EOF"
            echo "$open_tasks"
            echo "TASK_EOF"
          } >> "$GITHUB_OUTPUT"

          # Phase 0(c) check: open Dependabot security alerts, severity-sorted (critical,
          # high, medium, low) the same way Phase A sorts priority:high/normal/priority:low
          # task issues, so a real vulnerability can jump the queue by how bad it is rather
          # than by open-date. Needs the security-events: read permission above; GitHub
          # enables Dependabot alerts by default for public repos, so no extra one-time setup
          # is needed here (unlike the GH_AUTOMATION_PAT prerequisites in docs/AUTOMATION.md).
          # Falls back to empty on any API error (e.g. alerts disabled) rather than failing
          # the run — Phase 0(c) below treats an empty list the same as "no open alerts".
          dependabot_alerts=$(gh api "repos/${{ github.repository }}/dependabot/alerts" \
            --paginate -f state=open --jq '
              def sevrank: if .security_advisory.severity == "critical" then 0
                           elif .security_advisory.severity == "high" then 1
                           elif .security_advisory.severity == "medium" then 2
                           else 3 end;
              sort_by(sevrank)[]
              | "- #\(.number) [\(.security_advisory.severity)] \(.dependency.package.name): \(.security_advisory.summary) (\(.html_url))"
            ' 2>/dev/null || true)
          {
            echo "dependabot_alerts<<DEPALERT_EOF"
            echo "$dependabot_alerts"
            echo "DEPALERT_EOF"
          } >> "$GITHUB_OUTPUT"

          # Open Dependabot dependency-update PRs (separate from the claude/auto-* list
          # above), so the prompt can tell whether an alert above already has a fix in
          # flight before deciding to act on it directly.
          dependabot_prs=$(gh pr list --state open --limit 100 --json number,headRefName,title \
            --jq '[.[] | select(.headRefName | startswith("dependabot/"))]
                  | .[] | "- #\(.number) (\(.headRefName)): \(.title)"')
          {
            echo "dependabot_prs<<DEPPR_EOF"
            echo "$dependabot_prs"
            echo "DEPPR_EOF"
          } >> "$GITHUB_OUTPUT"

          # Separately surface already-open gap-analysis proposals, so the Phase B gap
          # analysis task can skip re-proposing something already in the backlog above.
          open_gap_issues=$(gh issue list --label gap-analysis --state open --limit 100 \
            --json number,title --jq '.[] | "- #\(.number): \(.title)"')
          {
            echo "open_gap_issues<<GAP_EOF"
            echo "$open_gap_issues"
            echo "GAP_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Surface a broken deploy.yml run
        # Deterministic (no Claude invocation) and unconditional — runs even when the guard step
        # sets skip=true (5-PR ceiling) or the "Run autonomous maintenance task" step below is
        # tolerated-skipped for a transient error, so a broken deploy is never silently missed on a
        # run that otherwise did nothing. deploy.yml itself is never touched — only an informational
        # comment/issue, deduped against a prior run's post for this exact failed run.
        if: steps.guard.outputs.main_deploy_broken == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ steps.guard.outputs.main_deploy_run_url }}
        run: |
          # Ordered by mergedAt (not gh pr list's default, which is unrelated to merge time) so
          # this is genuinely the most recently merged PR, not just one recently updated.
          merged_pr=$(gh pr list --state merged --limit 5 --json number,mergedAt \
            --jq 'sort_by(.mergedAt) | reverse | .[0].number // empty')
          if [ -n "$merged_pr" ]; then
            already_commented=$(gh pr view "$merged_pr" --json comments \
              --jq --arg url "$RUN_URL" '[.comments[].body | select(contains($url))] | length > 0')
            if [ "$already_commented" = "true" ]; then
              echo "Already commented on #$merged_pr for this failed run ($RUN_URL); skipping."
            else
              printf -v comment_body 'The latest `deploy.yml` (GitHub Pages) run on `main` failed: %s\n\n`deploy.yml` is on this workflow'"'"'s protected/denied file list, so `autonomous-maintenance.yml` can'"'"'t fix it directly — flagging for a human to look at.' "$RUN_URL"
              gh pr comment "$merged_pr" --body "$comment_body"
            fi
          else
            open_issue=$(gh issue list --state open --search "in:body \"$RUN_URL\"" --limit 1 \
              --json number --jq '.[0].number // empty')
            if [ -n "$open_issue" ]; then
              echo "Already filed #$open_issue for this failed run ($RUN_URL); skipping."
            else
              printf -v issue_body 'The latest `deploy.yml` run on `main` failed: %s\n\nNo recently merged PR was found to comment on instead. `deploy.yml` is on `autonomous-maintenance.yml`'"'"'s protected/denied file list, so this can'"'"'t be fixed directly by that workflow — needs a human.' "$RUN_URL"
              gh issue create --title "deploy.yml (GitHub Pages) failed on main" --body "$issue_body"
            fi
          fi

      - name: Enable Corepack
        if: steps.guard.outputs.skip != 'true'
        run: corepack enable

      - name: Set up Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Compose prompt
        id: compose-prompt
        if: steps.guard.outputs.skip != 'true'
        env:
          REPO: ${{ github.repository }}
          OPEN_PRS: ${{ steps.guard.outputs.open_prs }}
          OPEN_TASKS: ${{ steps.guard.outputs.open_tasks }}
          OPEN_GAP_ISSUES: ${{ steps.guard.outputs.open_gap_issues }}
          MAIN_CI_BROKEN: ${{ steps.guard.outputs.main_ci_broken }}
          MAIN_CI_RUN_URL: ${{ steps.guard.outputs.main_ci_run_url }}
          FAILING_PRS: ${{ steps.guard.outputs.failing_prs }}
          DEPENDABOT_ALERTS: ${{ steps.guard.outputs.dependabot_alerts }}
          DEPENDABOT_PRS: ${{ steps.guard.outputs.dependabot_prs }}
        run: |
          # Assembled here, rather than inline in the claude-code-action step's with.prompt
          # field below, to work around a GitHub Actions parser limit: a YAML scalar mixing
          # literal text with templated expressions gets compiled into one combined expression
          # capped at 21,000 characters (literal text + expressions together) - this prompt's
          # literal text alone was already past that. Composing it here with plain bash and
          # exposing it as a single step output lets the action step's prompt field be a pure,
          # single expression reference to this step's own output (no mixed content, so the
          # limit doesn't apply), with the actual wording unchanged. Substitution uses bash's
          # own parameter-expansion string replacement rather than envsubst, which isn't
          # guaranteed present on the runner image. See docs/DESIGN_HISTORY.md for the
          # incident this fixes.
          #
          # NOTE for future edits: this comment block deliberately avoids writing the literal
          # dollar-brace-brace expression syntax, even inside this comment or in backticks -
          # GitHub Actions substitutes that syntax anywhere in a run: block's raw text before
          # bash ever sees it, comments included, so writing it literally here would itself be
          # parsed as an (invalid, empty) expression and break the workflow file the same way
          # this fix addresses.
          : "${OPEN_PRS:=(none)}"
          : "${OPEN_TASKS:=(none)}"
          : "${OPEN_GAP_ISSUES:=(none)}"
          : "${FAILING_PRS:=(none)}"
          : "${DEPENDABOT_ALERTS:=(none)}"
          : "${DEPENDABOT_PRS:=(none)}"
          if [ "$MAIN_CI_BROKEN" = "true" ]; then
            MAIN_CI_STATUS_LINE="FAILED: $MAIN_CI_RUN_URL"
          else
            MAIN_CI_STATUS_LINE="is green."
          fi
          cat <<'TEMPLATE_EOF' > "$RUNNER_TEMP/prompt-template.txt"
          You are running as a scheduled, unattended maintenance job on this repository
          (REPO: $REPO). Nobody is watching this run, so only make changes
          you are confident are safe, small, and correct. There is no fixed turn-count cap on this
          run. Instead, before picking or sizing a task below, estimate how much of the current
          rolling 5-hour Claude usage window is likely still available and aim to keep this run's
          planned work at or under roughly 50% of a full window's worth of effort — every tool call
          counts as a turn, so use elapsed turns/time so far in the run as your practical signal
          once you're underway. This is a self-estimated heuristic, not a metered value: you have no
          visibility into how much of the window autonomous-pr-followup.yml or interactive usage may
          already be consuming concurrently. 50% is a soft aim, not a hard stop — its margin exists
          to absorb both that estimation inaccuracy and unknown concurrent usage, so modestly
          overshooting it because a task turned out bigger than expected is fine, not a failure to
          avoid at all costs. Work efficiently regardless: avoid redundant reads and re-checks.

          Read CLAUDE.md first — it documents this repo's architecture, conventions, and testing
          setup, and you must follow it exactly.

          Currently-open autonomous PRs (branch: title):
          $OPEN_PRS

          Open task backlog (issues labeled claude-task, curated by the maintainer in planning
          sessions):
          $OPEN_TASKS

          Currently-open gap-analysis proposals (number: title), filed by a previous run's gap
          analysis task (see Phase B item 6):
          $OPEN_GAP_ISSUES

          Main branch CI status: the latest completed run of ci.yml on main
          $MAIN_CI_STATUS_LINE

          Open PRs with a failing check (excludes claude/auto-* branches, which
          autonomous-pr-followup.yml already owns, and fork PRs):
          $FAILING_PRS

          Currently-open Dependabot security alerts, most severe first (critical, then high,
          then medium, then low):
          $DEPENDABOT_ALERTS

          Currently-open Dependabot dependency-update PRs (branch: title) — cross-check these
          against the alerts above before deciding an alert needs a fix of your own; a fix
          already in flight there means Phase 0(b) above (or pr-auto-merge.yml, once its
          checks pass) already has it covered:
          $DEPENDABOT_PRS

          This is a side project — time is not a constraint (one task per scheduled run is fine), but
          your self-estimated usage-window budget per run is (see above). Before you start
          implementing whatever task you pick below, roughly size it against that budget, reserving
          a buffer of roughly the last 15-20% of it for test + commit + push + PR-open overhead, so
          you don't run out mid-work. If a task looks too large to land safely within that budget
          even after buffering:
          - For a Phase A task issue, implement the largest coherent, independently-valuable,
            test-covered SLICE of the spec first — see the `Part of #<number>` guidance in Phase A
            below, instead of abandoning the task or attempting the whole thing at once.
          - For a Phase B menu task, scope this run to one coherent sub-area (e.g. one file, one
            specific gap) rather than trying to cover everything the item could mean at once, and
            leave the rest for a future run to pick up under the same menu item.

          Either way, don't wait until everything is finished to create visible progress: open the
          PR as soon as there's a meaningful, buildable, test-passing first commit rather than only
          at the very end, and push each subsequent meaningful commit as you make it rather than
          batching every commit into one push at the end. If the run is ever cut short by the usage
          budget, whatever has already landed then stays as real, discoverable progress on a real
          PR instead of being lost with the ephemeral runner.

          You do exactly ONE unit of work per run, chosen in three phases. A CI/CD failure
          (Phase 0) always outranks the task backlog (Phase A), which always outranks the
          maintenance menu (Phase B) — check them in that order and stop at the first one that
          applies.

          PHASE 0 — CI/CD failures (highest priority; skip straight past Phase A/B if this
          applies, even if the 5-PR ceiling below would otherwise skip the run entirely). A
          failing CI check blocks every other PR from merging via the required `test` check and
          erodes trust in the automation, so treat it as more urgent than any feature or
          maintenance work:
          - (a) If "Main branch CI status" above says FAILED, that is the single highest
            priority thing to do this run, full stop — do not also attempt Phase A or B. Open
            the failing run with `gh run view <run-id> --log-failed` (parse the run id from the
            URL) to find the actual error, create a branch named
            `claude/heal-main-<short-slug>` off the latest main, make the smallest correct fix
            that gets `yarn test` (and `yarn build` if the failure is build-related) green again,
            push it, and open a PR with `gh pr create` explaining what broke and why the fix
            addresses it. Do not force-merge it yourself. After the final commit, run the
            adversarial review ritual (CLAUDE.md) and, if APPROVE + low-risk, enable auto-merge
            with `scripts/enable-auto-merge-if-eligible.sh`. This branch prefix is already
            recognized by pr-auto-merge.yml's low-risk auto-merge path, so a small fix can merge
            without waiting for a human or for your next run.
          - (b) Otherwise, if "Open PRs with a failing check" above is non-empty, pick one (most
            valuable first) and unblock it:
            - For a Dependabot PR (branch starts with `dependabot/`): these usually fail because
              the branch has gone stale against main (e.g. it predates a source change the PR's
              own copy of the tests doesn't know about yet), not because of the dependency bump
              itself. Confirm with `gh pr view <number> --json mergeStateStatus` — if it shows
              the branch is behind, request a rebase by commenting exactly `@dependabot rebase`
              via `gh pr comment <number> --body '@dependabot rebase'`. Check
              `gh pr view <number> --json comments` first and skip this PR if that comment is
              already there from a previous run (rebase runs asynchronously; don't re-request or
              push your own commits to a `dependabot/*` branch). If the branch is NOT behind
              main, the failure is a real issue with the bump itself — leave it for a human, do
              not attempt a code fix.
            - For any other non-`claude/auto-*` PR, only act if you can identify a genuine,
              small, confidently-correct fix; otherwise leave it for a human rather than guessing.
            - After handling one PR this way, end the run — do not also attempt Phase A or B.
          - (c) Otherwise, if "Currently-open Dependabot security alerts" above has any
            critical or high severity entry, handle the single most severe one (critical
            before high; lowest alert number breaks a tie) — a real, disclosed vulnerability
            outranks the feature/maintenance backlog the same way a broken main outranks
            everything else:
            - First check whether "Currently-open Dependabot dependency-update PRs" already
              has an entry for the same package (match by package name against the PR title
              or branch). If so, a fix is already in flight — Phase 0(b) above (if it's
              failing) or pr-auto-merge.yml (once its checks pass) already has it covered, so
              skip straight to whichever of (a)/(b) actually applies instead of duplicating
              that work here.
            - Otherwise, read the alert's full detail with
              `gh api repos/$REPO/dependabot/alerts/<number>` for the
              vulnerable/patched version range. If the patched version is a safe patch or
              minor bump of a direct dependency, apply it (`yarn upgrade
              <package>@<patched-version>`, respecting yarn.lock / Yarn Classic v1), confirm
              `yarn test` and `yarn build` are green, and open a PR on branch
              `claude/auto-dep-alert-<number>-<short-slug>` whose body notes
              `Addresses Dependabot alert #<number>`. Merging removes the vulnerable version,
              which is what actually closes the alert — never call the Dependabot alerts API
              to dismiss it directly; a forced dismissal without a real fix would just hide a
              live vulnerability.
            - If the fix needs a major/breaking bump, or the affected package isn't something
              you can safely resolve with confidence this run, do not attempt it half-way:
              file a `claude-task` issue instead (`gh issue create`) describing the alert
              (package, severity, summary, URL) so it enters the ordinary Phase A backlog at
              the front of the queue. Ensure both labels exist first (idempotent):
              `gh label create priority:high --color b60205 --description "Jumps the Phase A
              backlog queue" --force` and `gh label create security --color d93f0b
              --description "Tracks a Dependabot security alert" --force`; apply
              `claude-task`, `priority:high`, and `security` to the new issue.
            - Either way (direct fix or issue filed), end the run — do not also attempt Phase
              A or B.
          - (d) If none of (a), (b), or (c) apply (main is green, the failing-PR list is
            empty, and there is no unaddressed critical/high Dependabot alert), fall through
            to Phase A.

          PHASE A — task backlog next. If the backlog above is non-empty, walk it in order and
          implement the first candidate that turns out to actually be implementable — do not
          stop at the first candidate just because it's skippable or turns out infeasible; keep
          moving down the order until you land on one you can implement, or you've worked through
          every eligible candidate:
          - Eligible means: no open autonomous PR above already covers it (its issue number
            appears in a branch name like claude/auto-task-<number>-* or in a PR title), and it
            is not blocked — if the issue body says "Blocked by #N", check #N with
            `gh issue view N` and skip this task while #N is still open. (Issues labeled
            `blocked` — either an environment/permission blocker, or a task issue where a
            second consecutive run confirmed it can't be implemented as written, see the
            comment-history check below — are excluded from the backlog list above before you
            ever see it.)
          - Order: issues labeled priority:high first, then normal (unlabeled) issues by lowest
            issue number (FIFO), then issues labeled priority:low last — a priority:low issue is
            only picked once no priority:high or normal-priority eligible candidate remains open.
            This is the order you walk candidates in, not just how you pick the first one.
            priority:low means "wait your turn behind everything else by default," not an
            absolute ban: a priority:low issue can still be picked earlier if a maintainer or an
            interactive session asks for it directly, or if it's genuinely the only eligible
            candidate left (everything else is blocked/covered/exhausted). Idempotently ensure
            the label exists before relying on it: `gh label create priority:low --color c5def5
            --description "Deferred until the rest of the backlog clears" --force`.
          - For each candidate in turn: first check its own comment history for a prior
            automated investigation you'd otherwise just repeat: `gh issue view <number> --json
            comments --jq '.comments[-3:] | .[] | "\(.author.login) @ \(.createdAt):\n\(.body)"'`.
            If the most recent comment(s) already reached a "not implementable as currently
            written" conclusion (stale/superseded spec, unresolvable ambiguity, etc.) — and
            nothing has changed since that would justify re-deriving it (no maintainer reply or
            issue-body edit after that comment, and no code change to the mechanism/files that
            comment discusses) — do not redo the full investigation from scratch. If this issue
            already has at least ONE prior comment reaching that same conclusion under those
            conditions, this run's independent look is a confirmed repeat: leave one short
            comment pointing at the earlier analysis instead of re-deriving pages of reasoning,
            apply the `blocked` label immediately (see the label instructions below — the same
            label and exclusion mechanism now applies to this case too, not just
            environment/permission blockers) so a third run never re-hits the same wall, and move
            on to the next eligible candidate in order. If this is the first time you are
            reaching this conclusion (no qualifying prior comment), proceed to read the full spec
            as normal.
          - Read the full spec with `gh issue view <number>`. Implement exactly what it says —
            its acceptance criteria are the definition of done, its "Out of scope" section is
            binding, and its "Verification" steps must be run in addition to `yarn test`.
          - If this candidate turns out infeasible for reasons other than size (ambiguous spec,
            can't get tests green after a reasonable attempt), do NOT half-land it: leave a
            comment on the issue with `gh issue comment` explaining exactly what's blocking, make
            no changes, and move on to the next eligible candidate in order (do not stop the run
            here). If the blocker is an environment/permission restriction of this unattended
            session itself (e.g. a Write the harness refuses to grant, like new files under
            .claude/), ALSO label the issue so future runs stop re-attempting it and burning their
            budget on the same wall: `gh label create blocked --color d93f0b --description
            "Infeasible for unattended runs until a human unblocks it" --force`, then
            `gh issue edit <number> --add-label blocked`. A human removes the label once
            unblocked. Do not apply the label on an ordinary spec/test problem's FIRST occurrence
            — stay comment-only initially, since a human may resolve it (close, rewrite, edit)
            before automation needs to step in. But per the comment-history check above, if this
            run's conclusion duplicates a prior comment's "infeasible as written" finding with
            nothing new in between, that's no longer a first occurrence — apply the `blocked`
            label right then, on this same run, rather than leaving it comment-only again and
            waiting for a third or later run to notice the pattern.
          - Budget guard on the walk itself: each skipped/infeasible candidate still costs turns
            (comment history check, spec read, investigation, comment). Weigh that spend against
            your self-estimated usage-window budget as you go — if you've already burned a
            meaningful chunk of this run's budget walking past infeasible candidates and there
            isn't enough left to confidently implement, test, and open a PR for whatever you'd
            pick up next (even a small slice), stop the walk there rather than continuing to
            consume budget with nothing to show for it. Ending the run with no PR after having
            left honest comments on every candidate you actually looked at is a fine outcome —
            better than forcing a rushed implementation of whatever candidate you happened to
            reach right as the budget ran out.
          - Once you land on a candidate you can actually implement, treat it exactly as before:
            name the branch `claude/auto-task-<number>-<short-slug>` (the issue number in the
            branch name is how future runs know this task is already in flight), and make the PR
            body include the line `Closes #<number>` so merging auto-closes the task — UNLESS
            this PR is a partial slice per the budget guidance above, in which case use
            `Part of #<number>` instead (no auto-close) and leave a `gh issue comment` on the task
            issue summarizing exactly what this slice covers and what remains, so a future run can
            pick up the rest (the issue stays open and eligible; only the PR that completes the
            full spec includes `Closes #<number>`).
          - If you work through every eligible candidate in the backlog without finding one you
            can implement, end the run without a PR — you've still made real progress (comments,
            and any new `blocked` labels, are durable signal for the next run and for a human),
            just not a code change this run.

          PHASE B — maintenance menu fallback. Only if Phase 0 doesn't apply and there is NO
          eligible task issue in Phase A, pick exactly one of the following menu tasks —
          whichever is most valuable given the current state of the repo. Minimise PRs for
          similar work: if one of the open
          PRs above already covers the same task/purpose you were about to pursue (e.g. another
          test-coverage PR while a test-coverage PR is already open), don't open a duplicate —
          either pick a different, genuinely independent task from the menu instead, or if every
          applicable task already has a matching open PR, make no changes this run. Conversely,
          do open a separate PR for a task that's genuinely independent of what's already open
          (e.g. a dependency bump alongside an already-open docs-sync PR) — the goal is avoiding
          redundant PRs, not minimising the total PR count.

          1. Test coverage gaps — find untested branches or edge cases in src/game/engine.js,
             src/game/layers.js, or src/game/storage.js and add tests for them.
          2. Dependency & security maintenance — run `yarn audit`, and check the medium/low
             severity entries in "Currently-open Dependabot security alerts" above (critical/high
             entries are Phase 0(c)'s responsibility, not this menu item, and won't still be
             listed there once handled). If there are safe patch or minor version bumps
             available for either source, apply them via `yarn install`/`yarn upgrade`
             (respecting yarn.lock, Yarn Classic v1 format) and confirm nothing breaks.
          3. Code quality / simplification — look for dead code, duplicated logic, or drift from
             CLAUDE.md's documented three-layer architecture (engine.js / useIncrementalGame.js /
             MainPage) and fix it.
          4. CLAUDE.md documentation sync — compare CLAUDE.md's documented function signatures,
             constants, state shape, and test counts against the real source, and correct any
             drift you find.
          5. Workflow self-improvement — review this task menu and this workflow file
             (.github/workflows/autonomous-maintenance.yml) itself: tighten a task description,
             add a new low-risk task type, or retire one that repeatedly finds nothing to do. You
             may edit ONLY .github/workflows/autonomous-maintenance.yml for this task — no other
             file under .github/workflows/. You must NOT weaken or remove, even in the name of
             "improving" it: the duplicate-PR guard step, the self-estimated usage-window budgeting
             instructions (the ~50%-of-window soft target and its self-scoping fallback behavior),
             the settings.permissions.deny list protecting the other workflow files, the requirement
             that you never force-merge or push your own PR to main (enabling GitHub auto-merge
             via `scripts/enable-auto-merge-if-eligible.sh` after an adversarial APPROVE on a
             low-risk PR is required, not forbidden — see CLAUDE.md), the requirement to always
             open a PR for human review instead of pushing straight to main, or the rule that the
             Phase A task backlog always takes priority over this menu.
          6. Gap analysis — survey the repo for a gap not already covered by an open issue or PR:
             a missing test, stale or missing documentation, a CI/CD failure mode nothing
             currently watches (Phase 0 above already covers a red main and stale/failing PRs —
             this is for other gaps, e.g. deploy.yml or CodeQL failures going unwatched), an
             unaddressed dependency/security finding, or a thin Phase A backlog. Skip any gap
             already covered by one of the currently-open gap-analysis
             proposals listed above. File exactly 1 well-specified claude-task issue (via
             `gh issue create`) proposing a concrete solution — match the structure of
             `.github/ISSUE_TEMPLATE/claude-task.yml` (Goal / Context / Spec & acceptance
             criteria / Files likely touched / Out of scope / Verification / Explicit
             authorizations / Dependencies) and size it the same way a human-authored task issue
             would be sized (small enough for one run's budget, or explicitly split with
             "Blocked by #N" if it's bigger). Do NOT implement the fix yourself in this run —
             this task only proposes, it never opens a PR. Label the new issue with both
             `claude-task` and `gap-analysis`; ensure the `gap-analysis` label exists first
             (idempotent: `gh label create gap-analysis --color 0e8a16 --description
             "Proposal filed by a gap-analysis run" --force`).

          Hard constraints, no exceptions:
          - Never add, remove, or reorder entries in TIER_DEFINITIONS (src/game/layers.js), and
            never make game-design/economy-rule changes, UNLESS you are implementing a Phase A
            task issue whose "Explicit authorizations" section explicitly permits that specific
            change — a claude-task issue is the maintainer's written sign-off. During Phase B
            menu runs (and Phase 0 heal-main fixes) this ban is absolute.
          - Never modify .github/workflows/ci.yml, deploy.yml, autonomous-pr-followup.yml,
            or pr-auto-merge.yml.
          - Never change the dev/test server host binding away from 127.0.0.1.
          - Never use `--no-verify`, never skip or delete a failing test to make it pass, never
            force-push, and never push directly to main.
          - Never push your own commits to a `dependabot/*` branch — Dependabot owns that
            branch's content; the only allowed interaction is the `@dependabot rebase` comment
            described in Phase 0(b).
          - Never call the Dependabot alerts API to dismiss an alert directly — an alert closes
            automatically once the vulnerable version is gone from a merged fix; only Phase
            0(c)'s actual dependency bump (or a human) may resolve one.
          - If a change touches anything CLAUDE.md documents (function signatures, constants,
            state shape, economy/game-rule behavior, file layout, or test counts), update
            CLAUDE.md in the same commit, per CLAUDE.md's own Documentation section.
          - Run `yarn test` (and `yarn build` if you touched dependencies) and confirm it is green
            before doing anything else.

          If, after all three phases, there is nothing safe and meaningful to do this run (no CI/CD
          failure, no eligible task issue, and no menu task worth doing), make no changes and end
          without creating a branch or PR — do not force a change just to have something to show.

          If you do make a code change: create a branch named `claude/heal-main-<short-slug>` for a
          Phase 0(a) fix, `claude/auto-dep-alert-<number>-<short-slug>` for a Phase 0(c) direct
          fix, `claude/auto-task-<number>-<short-slug>` for a Phase A task, or
          `claude/auto-<short-task-slug>` for a Phase B menu task, commit, push it, and open a pull
          request against main using `gh pr create`. Structure the PR body to match
          .github/pull_request_template.md (Summary / Test plan / Documentation sections), filling
          in the checkboxes truthfully based on what you actually ran — and for a Phase A task,
          include the `Closes #<number>` line (or `Part of #<number>` for a partial slice, per the
          budget guidance above). The three exceptions are Phase 0(b)'s Dependabot rebase request
          (a comment, not a branch or PR), Phase 0(c)'s issue-filing path when a critical/high
          alert needs more than a safe direct bump, and Phase B item 6 (gap analysis) — all three
          produce a filed issue or comment, not a branch or PR.

          After the final commit on a finished PR (local checks green, nothing further planned):
          run the adversarial review in `.claude/agents/code-reviewer.md` (spawn that subagent if
          your tool list allows; otherwise apply its checklist yourself), post a PR comment that
          includes its machine-readable marker
          (`<!-- adversarial-review sha=<headOid> verdict=APPROVE|NEEDS_CHANGES|BLOCK -->`), and
          when the verdict is APPROVE and the PR meets the low-risk bar, **always** enable
          auto-merge with `scripts/enable-auto-merge-if-eligible.sh <pr> --require-adversarial-approve`
          (marks ready if needed). That enables GitHub auto-merge only — never force-merge, never
          push to main, never submit a GitHub approval on your own PR. See CLAUDE.md "After the
          final commit" and docs/AUTOMATION.md Auto-merge Path 3.
          TEMPLATE_EOF
          prompt_text=$(cat "$RUNNER_TEMP/prompt-template.txt")
          prompt_text=${prompt_text//'$REPO'/$REPO}
          prompt_text=${prompt_text//'$OPEN_PRS'/$OPEN_PRS}
          prompt_text=${prompt_text//'$OPEN_TASKS'/$OPEN_TASKS}
          prompt_text=${prompt_text//'$OPEN_GAP_ISSUES'/$OPEN_GAP_ISSUES}
          prompt_text=${prompt_text//'$FAILING_PRS'/$FAILING_PRS}
          prompt_text=${prompt_text//'$DEPENDABOT_ALERTS'/$DEPENDABOT_ALERTS}
          prompt_text=${prompt_text//'$DEPENDABOT_PRS'/$DEPENDABOT_PRS}
          prompt_text=${prompt_text//'$MAIN_CI_STATUS_LINE'/$MAIN_CI_STATUS_LINE}
          {
            echo "prompt<<PROMPT_COMPOSE_EOF"
            printf '%s\n' "$prompt_text"
            echo "PROMPT_COMPOSE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run autonomous maintenance task
        id: claude
        if: steps.guard.outputs.skip != 'true'
        # Tolerated-failure handling: the step below re-fails the job for any real error,
        # but downgrades a pure Claude-side transient failure (HTTP 429 usage-quota
        # exhaustion, or a 5xx server overload like 529 "Overloaded") to a warning — the
        # run did no work and the next scheduled run simply retries, so a red X adds alert
        # noise without any actionable signal.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_AUTOMATION_PAT }}
          base_branch: main
          branch_prefix: claude/auto-
          # This repo is public, so the run's logs are public either way; the transcript is
          # the only way to see WHY an unattended run ended without producing anything.
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(yarn:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr ready:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh label create:*),Bash(gh api repos/*/milestones:*),Bash(gh api repos/*/dependabot/alerts*:*),Bash(scripts/enable-auto-merge-if-eligible.sh:*),Bash(scripts/pr-low-risk-eligible.sh:*),Bash(./scripts/enable-auto-merge-if-eligible.sh:*),Bash(./scripts/pr-low-risk-eligible.sh:*)"
          settings: |
            {
              "permissions": {
                "deny": [
                  "Edit(.github/workflows/ci.yml)",
                  "Write(.github/workflows/ci.yml)",
                  "Edit(.github/workflows/deploy.yml)",
                  "Write(.github/workflows/deploy.yml)",
                  "Edit(.github/workflows/autonomous-pr-followup.yml)",
                  "Write(.github/workflows/autonomous-pr-followup.yml)",
                  "Edit(.github/workflows/pr-auto-merge.yml)",
                  "Write(.github/workflows/pr-auto-merge.yml)"
                ]
              }
            }
          prompt: ${{ steps.compose-prompt.outputs.prompt }}

      - name: Classify Claude step failure
        # Companion to the continue-on-error above: keep every real failure red, but treat
        # a run that died before doing any work because of a transient, Claude-side error —
        # the subscription's usage quota was exhausted (429 "session limit"), or the API
        # itself was briefly overloaded (5xx, e.g. 529 "Overloaded") — as a skipped run: it
        # made no changes, cost no quota, and the next scheduled run retries
        # automatically. Confirmed via a real run (2026-07-29) that exhausted the SDK's own
        # 10-attempt retry budget against a 529 and then hard-failed under the old
        # 429-only check, which would otherwise have looked like a real break to Phase 0 of
        # the *next* run.
        if: steps.guard.outputs.skip != 'true' && steps.claude.outcome == 'failure'
        run: |
          out="${{ steps.claude.outputs.execution_file }}"
          [ -n "$out" ] && [ -f "$out" ] || out="$RUNNER_TEMP/claude-execution-output.json"
          transient_status=""
          if [ -f "$out" ]; then
            transient_status=$(jq -r '
                  (if type == "array" then . else [.] end)
                  | map(select(.type == "result"))
                  | last
                  | if (.is_error == true) and (.api_error_status as $s | [429, 500, 502, 503, 529] | index($s) != null)
                    then .api_error_status
                    else empty
                    end
                ' "$out" 2>/dev/null)
          fi
          if [ -n "$transient_status" ]; then
            echo "::warning::Run skipped: transient Claude API error (HTTP $transient_status) before any work was done. The next scheduled run will retry."
            exit 0
          fi
          echo "::error::Claude run failed for a reason other than a transient quota/server error — see the 'Run autonomous maintenance task' step logs."
          exit 1

      - name: Fail on denied file modifications
        # The inverse blind spot of the step above: the action step can exit 0 while the
        # run inside it failed to do its job. Concretely: three consecutive green runs each
        # picked task #78, had every Write into .claude/skills//.claude/agents/ refused by
        # the harness's unattended-session guardrail, and ended "successfully" having only
        # left an issue comment — silently, with no signal a human would ever see without
        # reading the transcript. Bash denials are NOT treated as failures: allowlist misses
        # (python3, mkdir, multi-line gh commands) are routine and the agent works around
        # them.
        #
        # Exception: if the run itself already ran `gh issue edit <n> --add-label blocked`
        # in response to the denial — the exact recovery Phase A's guidance asks for — the
        # denial was properly diagnosed and hand-delivered to a human via the issue itself
        # (comment + label), not silently swallowed like #78 was. That issue comment is
        # already a durable, actionable signal on its own; a red job on top of it doesn't add
        # anything a human would act on differently, and the label already keeps future runs
        # from repeating it (see the guard step's Phase A exclusion). Confirmed for real via
        # #79: a run hit the same .claude/ restriction, correctly labeled it blocked, and the
        # job still went red for a task that was, from the run's own perspective, handled
        # exactly as instructed — see docs/DESIGN_HISTORY.md.
        if: steps.guard.outputs.skip != 'true' && steps.claude.outcome == 'success'
        run: |
          out="${{ steps.claude.outputs.execution_file }}"
          [ -n "$out" ] && [ -f "$out" ] || out="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$out" ] || { echo "No execution output found; nothing to check."; exit 0; }
          denied=$(jq -r '
                (if type == "array" then . else [.] end)
                | map(select(.type == "result")) | last
                | .permission_denials // []
                | map(select(.tool_name == "Write" or .tool_name == "Edit" or .tool_name == "NotebookEdit"))
                | .[] | "\(.tool_name): \(.tool_input.file_path // "(unknown path)")"
              ' "$out")
          if [ -z "$denied" ]; then
            echo "No denied file modifications."
            exit 0
          fi
          echo "::warning::The Claude run was denied one or more file modifications:"
          echo "$denied"
          labeled_blocked=$(jq -r '
                [.. | objects | select(has("command")) | .command // empty]
                | any(test("add-label\\s+blocked"))
              ' "$out")
          if [ "$labeled_blocked" = "true" ]; then
            echo "The run labeled the affected issue 'blocked' in response — properly diagnosed and handed off to a human, not silently swallowed. Job stays green."
            exit 0
          fi
          echo "::error::...and did not label the affected issue 'blocked' to hand it off — could not fully do its work with no durable signal left behind:"
          echo "$denied"
          echo "::error::If this was a task issue that needs a path an unattended run can't write (e.g. .claude/skills/), label the issue 'blocked' so future runs skip it, and handle it interactively."
          exit 1
