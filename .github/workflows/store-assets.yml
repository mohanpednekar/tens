name: Store assets

# On-demand store asset bundle: plays the bot seeds, captures every store screenshot set, renders the
# feature graphic and writes release notes (`yarn store:assets`, `yarn store:notes`), then uploads
# them as one artifact in fastlane's layout. Uploads nothing to any store and needs no secrets —
# store-release.yml does the uploading. Run it from Actions → Store assets → Run workflow (or
# `gh workflow run store-assets.yml`). docs/STORE_RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: Comma-separated device ids (scripts/store-assets/manifest.mjs DEVICES); empty = all
        type: string
        default: ''
      scenes:
        description: Comma-separated scene ids (SCENES); empty = all
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: store-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-yarn

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate store images
        env:
          DEVICES: ${{ inputs.devices }}
          SCENES: ${{ inputs.scenes }}
        run: |
          args=()
          [ -n "$DEVICES" ] && args+=(--devices "$DEVICES")
          [ -n "$SCENES" ] && args+=(--only "$SCENES")
          yarn store:assets "${args[@]}"

      - name: Release notes from CHANGELOG.md
        # No section yet for an unreleased version is fine here — the images are still useful.
        run: yarn store:notes || echo "::notice::No CHANGELOG section for this version; release notes skipped"

      - uses: actions/upload-artifact@v7
        with:
          name: tens-store-assets-${{ github.run_number }}
          path: |
            fastlane/metadata/
            fastlane/screenshots/
            fastlane/play-foldable/
          if-no-files-found: error
