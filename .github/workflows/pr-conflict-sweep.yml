name: PR conflict sweep

# After every merge to main (push event), check every open PR's mergeable state.
# A PR that has become CONFLICTING gets a comment asking for a real merge of
# main into the branch. For `claude/*` and `devin/auto-*` branches that comment
# also triggers autonomous-pr-followup.yml, which resolves the conflict
# autonomously. A per-head-SHA marker prevents comment spam when a PR stays
# conflicted across several merges.
#
# Uses GH_AUTOMATION_PAT rather than GITHUB_TOKEN: comments authored by the
# default token cannot trigger the follow-up workflow (the same reason every
# other automation workflow uses the PAT).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write # PR comments are issue comments under the hood

concurrency:
  group: pr-conflict-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check open PRs for merge conflicts
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
        run: |
          set -euo pipefail

          gh pr list --state open --limit 100 \
            --json number,headRefName,headRefOid,mergeable,author \
            > /tmp/open-prs.json

          jq -c '.[]' /tmp/open-prs.json | while read -r pr; do
            num=$(jq -r .number <<<"$pr")
            branch=$(jq -r .headRefName <<<"$pr")
            head=$(jq -r .headRefOid <<<"$pr")
            mergeable=$(jq -r .mergeable <<<"$pr")
            author=$(jq -r '.author.login' <<<"$pr")
            echo "PR #$num ($branch, @$author): mergeable=$mergeable"

            [ "$mergeable" = "CONFLICTING" ] || continue

            marker="<!-- pr-conflict-sweep sha=$head -->"
            # Skip if we already flagged this exact head — a new head push
            # (e.g. a fix attempt) resets the dedupe.
            already=$(gh pr view "$num" --json comments \
              --jq --arg marker "$marker" \
              '[.comments[].body | select(contains($marker))] | length')
            if [ "$already" -gt 0 ]; then
              echo "  already flagged at this head — skipping"
              continue
            fi

            case "$branch" in
              claude/*|devin/*)
                # The comment doubles as the trigger for autonomous-pr-followup.
                body=$(printf '%s\n%s' "$marker" \
                  "This PR has merge conflicts with \`main\` after the latest merge. Merge \`main\` into \`$branch\` (no rebase — review context is anchored to existing SHAs), resolve the conflicts for real, re-run \`yarn test\`, and push to the same branch.")
                ;;
              *)
                body=$(printf '%s\n%s' "$marker" \
                  "Heads-up @$author: this PR now has merge conflicts with \`main\` after the latest merge. Please merge \`main\` into \`$branch\` and resolve them — the PR cannot merge while conflicted.")
                ;;
            esac

            gh pr comment "$num" --body "$body"
            echo "  commented on #$num"
          done
