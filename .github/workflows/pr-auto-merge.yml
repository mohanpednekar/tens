name: Auto-merge on approval

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Path 1: a human owner/collaborator/member approves the PR — unconditional, any PR,
  # any size, matching the original behavior.
  auto-merge-on-approval:
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
        run: |
          # Must match the Main ruleset's allowed_merge_methods (merge + rebase;
          # squash is not allowed). Using --squash fails enable-auto-merge for every PR.
          gh pr merge --auto --merge "${{ github.event.pull_request.number }}" \
            -R "${{ github.repository }}"

  # Path 2: no human approval yet, but checks just went green on a bot-authored branch and
  # the diff meets a conservative "low risk" bar. Skips the approval wait for routine,
  # easy-to-verify-after-the-fact changes; everything else (including any workflow-file
  # change, at any size) still needs a human to approve via Path 1.
  auto-merge-low-risk:
    if: github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
      CHECK_SUITE_BRANCH: ${{ github.event.check_suite.head_branch }}
    steps:
      - name: Checkout eligibility scripts
        uses: actions/checkout@v7

      - name: Merge if the PR on this branch meets the low-risk bar
        run: |
          # Only our own automation's branches are eligible for approval-free merge —
          # never a human contributor's branch, bot or not. Both engines' prefixes qualify:
          # claude/* (autonomous-maintenance.yml) and cursor/* (cursor-autonomous-maintenance.yml).
          case "$CHECK_SUITE_BRANCH" in
            claude/auto-*|claude/self-heal-*|claude/heal-main-*|cursor/auto-*|cursor/heal-main-*|dependabot/*) ;;
            *)
              echo "Not a bot-authored branch ($CHECK_SUITE_BRANCH), skipping."
              exit 0
              ;;
          esac

          number=$(gh pr list --head "$CHECK_SUITE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open PR for this branch, skipping."
            exit 0
          fi

          # Shared bar with scripts/pr-low-risk-eligible.sh / enable-auto-merge-if-eligible.sh.
          # Do not require an adversarial marker here — Dependabot and other low-risk bots
          # still merge on green checks alone. Path 3 below handles the post-review ritual.
          if scripts/enable-auto-merge-if-eligible.sh "$number"; then
            echo "Low-risk auto-merge path succeeded for PR #$number."
          else
            echo "PR #$number doesn't meet the low-risk bar (or could not enable auto-merge)."
          fi

  # Path 3: an adversarial code-reviewer APPROVE marker was posted for the PR's current
  # HEAD after the final commit. If the PR is also low-risk, always enable auto-merge
  # (and mark ready if still draft). Re-posts for an old SHA are ignored.
  #
  # Public-repo pwn-request surface: anyone can comment on a PR. Only OWNER /
  # COLLABORATOR / MEMBER comments may trigger this privileged path (same gate as
  # autonomous-pr-followup.yml / cursor-pr-followup.yml).
  auto-merge-after-adversarial-approve:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, 'adversarial-review') &&
      contains(github.event.comment.body, 'verdict=APPROVE')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Checkout eligibility scripts
        uses: actions/checkout@v7

      - name: Enable auto-merge when low-risk + APPROVE on current HEAD
        run: |
          # Require the *triggering* comment (not an older one) to carry a marker for
          # the current HEAD — avoids arming from a stale APPROVE still in the thread.
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          marker_re="<!--[[:space:]]*adversarial-review[[:space:]]+sha=${head_sha}[[:space:]]+verdict=APPROVE[[:space:]]*-->"
          if ! grep -Eiq "$marker_re" <<<"$COMMENT_BODY"; then
            echo "Triggering comment has no APPROVE marker for current HEAD ($head_sha); skipping."
            exit 0
          fi
          if scripts/enable-auto-merge-if-eligible.sh "$PR_NUMBER" --require-adversarial-approve; then
            echo "Auto-merge enabled after adversarial APPROVE on PR #$PR_NUMBER."
          else
            echo "PR #$PR_NUMBER not eligible after adversarial comment (not low-risk, SHA mismatch, or fork)."
          fi
