name: Mobile build

# Builds the Capacitor native apps (#70): an unsigned debug Android APK and an iOS Simulator
# .app, uploaded as workflow artifacts, plus an R8-minified release build signed with a throwaway
# CI key that is booted on an emulator to prove minification didn't break the app. None of these
# artifacts is store-ready — store uploads are signed locally with the real upload key
# (docs/RELEASE_ANDROID.md). Runs on demand, and on
# PRs/pushes that touch the native projects or their Capacitor config so a broken native tree is
# caught before merge — ordinary web-only changes don't spend runner time here.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.js'
      - 'viteConfigFactory.js'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.js'
      - 'viteConfigFactory.js'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-yarn

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build web assets and sync Android project
        run: |
          yarn build:capacitor
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: tens-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-yarn

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create a throwaway upload key (CI only, never the real one)
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci-upload.jks" -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 -storepass ci-pass -keypass ci-pass \
            -dname "CN=Tens CI"
          {
            echo "TENS_UPLOAD_STORE_FILE=$RUNNER_TEMP/ci-upload.jks"
            echo "TENS_UPLOAD_STORE_PASSWORD=ci-pass"
            echo "TENS_UPLOAD_KEY_ALIAS=ci"
            echo "TENS_UPLOAD_KEY_PASSWORD=ci-pass"
          } >> "$GITHUB_ENV"

      - name: Build signed, minified release AAB and APK
        run: |
          yarn build:capacitor
          npx cap sync android
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the minified release build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android-boot-smoke.sh android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: tens-android-release-ci-signed
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-yarn

      - name: Build web assets and sync iOS project
        run: |
          yarn build:capacitor
          npx cap sync ios
          yarn ios:configure

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd ios/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/tens-ios-simulator.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: tens-ios-simulator-app
          path: tens-ios-simulator.zip
          if-no-files-found: error
