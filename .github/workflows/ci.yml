name: CI

# push is limited to main so a PR branch doesn't run the same test job twice per push
# (once for the branch push, once for the pull_request event) — PRs get their required
# `test` check from the pull_request run alone.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-yarn

      # bash -n every run: block in .github/workflows/*.yml + .github/actions/** —
      # catches a broken embedded script on the PR that introduces it, not days later
      # when the workflow next runs (see #709's unclosed-brace outage / #738). Lives
      # inside the required `test` job so the check is merge-blocking without a
      # branch-protection change.
      - name: Lint workflow shell blocks
        run: yarn lint:workflows

      - name: Run tests
        run: yarn test
